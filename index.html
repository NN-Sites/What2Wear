<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>What2Wear</title>
  <link rel="icon" href="https://i.postimg.cc/cCWcB62x/What2-Wear-logo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Rubik', sans-serif;
      padding: 2rem;
      background: #f0f0f0;
      color: #333;
      direction: rtl;
    }
    h1 {
      font-size: 2.5rem;
    }
    form {
      display: grid;
      gap: 1rem;
      margin-top: 2rem;
    }
    label {
      font-weight: bold;
    }
    select, button {
      padding: 0.5rem;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #4CAF50;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }
    button:hover {
      background-color: #388e3c;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 2rem;
      background: white;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 1rem;
      text-align: center;
    }
    .share-buttons button {
      margin: 0.5rem 0.3rem;
    }
  </style>
</head>
<body>
  <h1>מה ללבוש היום? 👕👖</h1>
  <form id="outfitForm">
    <label>מין:</label>
    <select name="gender">
      <option>גבר</option>
      <option>אישה</option>
    </select>
    <label>סוג האירוע:</label>
    <select name="event">
      <option>חתונה</option>
      <option>בר מצווה</option>
      <option>אירוע משפחתי</option>
      <option>יציאה עם חברים</option>
      <option>טיול</option>
    </select>
    <label>עונה:</label>
    <select name="season">
      <option>חורף</option>
      <option>קיץ</option>
      <option>סתיו</option>
      <option>אביב</option>
    </select>
    <label>זמן ביום:</label>
    <select name="timeOfDay">
      <option>בוקר</option>
      <option>צהריים</option>
      <option>ערב</option>
    </select>
    <label>סגנון לבוש:</label>
    <select name="style">
      <option>אלגנט</option>
      <option>חגיגי</option>
      <option>יומיומי</option>
    </select>
    <label>צבע מועדף:</label>
    <select name="color">
      <option>שחור</option>
      <option>לבן</option>
      <option>כחול</option>
      <option>אדום</option>
      <option>ירוק</option>
    </select>
    <button type="submit">קבל המלצה!</button>
  </form>

  <div id="result"></div>

  <script>
    const form = document.getElementById('outfitForm');
    const resultDiv = document.getElementById('result');
    let shareText = '';
    let currentLook = null;

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const data = new FormData(form);
      const gender = data.get('gender');
      const event = data.get('event');
      const season = data.get('season');
      const time = data.get('timeOfDay');
      const style = data.get('style');
      const color = data.get('color');

      const shirt = season === 'חורף' ? 'סוודר' : (season === 'קיץ' ? 'חולצה קצרה' : 'חולצה מכופתרת');
      const pants = style === 'אלגנט' ? 'מכנס מחויט' : 'מכנס קל';
      const shoes = style === 'חגיגי' ? 'נעליים אלגנטיות' : (season === 'קיץ' ? 'כפכפים או סניקרס' : 'נעלי ספורט');
      const extras = ['לבוש חגיגי', 'ג׳קט או עליונית', `סגנון ${style}`, `צבע מועדף: ${color}`];

      currentLook = { shirt, pants, shoes, extras, event, season, time };

      shareText = `זה הלוק שיצרתי ב-What2Wear
לאירוע: ${event}
עונה: ${season}
זמן: ${time}

חולצה: ${shirt}
מכנס: ${pants}
נעליים: ${shoes}
תוספות:
- ${extras.join('\n- ')}`;

      resultDiv.innerHTML = `
        <table>
          <thead>
            <tr><th>חולצה</th><th>מכנס</th><th>נעליים</th><th>עוד</th></tr>
          </thead>
          <tbody>
            <tr>
              <td>${shirt}</td>
              <td>${pants}</td>
              <td>${shoes}</td>
              <td>${extras.join('<br>')}</td>
            </tr>
          </tbody>
        </table>
        <div class="share-buttons">
          <button onclick="copyLook()">העתק ללוח</button>
          <button onclick="shareWhatsApp()">שלח ב-WhatsApp</button>
          <button onclick="saveLook()">💾 שמור לוק</button>
          <a href="saved.html"><button>📂 לצפייה בלוקים שנשמרו</button></a>
        </div>
      `;
    });

    function copyLook() {
      navigator.clipboard.writeText(shareText).then(() => {
        alert('הלוק הועתק בהצלחה!');
      });
    }

    function shareWhatsApp() {
      const url = `https://wa.me/?text=${encodeURIComponent(shareText)}`;
      window.open(url, '_blank');
    }

    function saveLook() {
      let saved = JSON.parse(localStorage.getItem('savedLooks') || '[]');
      saved.push(currentLook);
      localStorage.setItem('savedLooks', JSON.stringify(saved));
      alert('הלוק נשמר בהצלחה!');
    }
  </script>
</body>
</html>
